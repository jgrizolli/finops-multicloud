name: Publicar a previa da interface no GitHub Pages

on:
  push:
    branches: [ main ]
    paths:
      - 'webapp/FinOps-Preview.html'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    name: Publicar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Montar o site
        run: |
          mkdir -p _site
          cp webapp/FinOps-Preview.html _site/index.html
          cp -r docs/images _site/images 2>/dev/null || true
          cat > _site/.nojekyll <<'FIM'
          FIM

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar
        id: deploy
        uses: actions/deploy-pages@v4
